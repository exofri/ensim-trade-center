<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ENSIM Trade Center — market &amp; leaderboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  tr:first-child td { font-weight: bold; }
  tr.baseline td { color: #888; font-style: italic; }
  .baseline-tag { font-size: 0.75rem; color: #888; font-weight: normal; }
  canvas { margin-top: 1.5rem; }
  #updated { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>ENSIM Trade Center</h1>
  <p> This is a simulation exercise, not real trading or real money. Italicized rows are the three built-in reference traders (random trader / buyer / seller) -- comparison baselines. Only total value is shown here .</p>
  <canvas id="priceChart" height="300"></canvas>
  <h2>Leaderboard</h2>
  <table id="leaderboardTable"><thead><tr><th>#</th><th>Trader</th><th>Total value</th></tr></thead><tbody></tbody></table>
  <p id="updated"></p>

<script>
    const leaderboard = board.leaderboard || [];
    const tbody = document.querySelector('#leaderboardTable tbody');
    tbody.innerHTML = leaderboard.map((r, i) => `
      <tr class="${r.baseline ? 'baseline' : ''}">
        <td>${i + 1}</td>
        <td>${r.name || r.id}${r.baseline ? ' <span class="baseline-tag">(baseline)</span>' : ''}</td>
        <td>${r.total_value.toFixed(1)}</td>
      </tr>`).join('');

    document.getElementById('updated').textContent =
      `Market last ticked ${market.generated_at}. Leaderboard last computed ${board.generated_at}.`;
  })
  .catch(err => {
    document.getElementById('updated').textContent = 'Could not load market data (' + err + ').';
  });
</script>
</body>
</html>
